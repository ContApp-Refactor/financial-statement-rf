services:
  financial-statement-rf:
    image: jeserna/financial-statement-rf:v0.0.23
    container_name: financial-statement-rf
    env_file:
      - ${SECRETS_DIR:-/opt/secrets}/common-configs.env
      - ${SECRETS_DIR:-/opt/secrets}/rabbit-mq-secrets.env
      - ${SECRETS_DIR:-/opt/secrets}/db-secrets.env
      - ${SECRETS_DIR:-/opt/secrets}/financial-statement-configs.env
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 10s
networks:
  dokploy-network:
    external: true
