spring:
  datasource:
    url: jdbc:h2:mem:financial_statement_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/auth/realms/oauth2-realm
          jwk-set-uri: http://localhost:8090/auth/realms/oauth2-realm/protocol/openid-connect/certs

  mail:
    host: ""
    port: 25

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

cors:
  allowed-origins: "*"

jwt:
  auth:
    converter:
      principle-attribute: preferred_username
      resource-id: microservices_client

mail:
  provider: smtp
  from: no-reply@contapp.local
  resend:
    api-key: ""
    reply-to: ""

services:
  account-info-service:
    base-url: https://bef02d1f-e3aa-47bc-a9e9-ab242f8696d0.mock.pstmn.io/accountInfo
    bearer-token: ${ACCOUNT_INFO_SERVICE_BEARER_TOKEN:}
    mock-mode-enabled: ${ACCOUNT_INFO_SERVICE_MOCK_MODE_ENABLED:false}
    accept-legacy-date-format: ${ACCOUNT_INFO_SERVICE_ACCEPT_LEGACY_DATE_FORMAT:false}

report-email:
  scheduler:
    fixed-delay-ms: 60000
    default-timezone: America/Bogota
    claim-lease-ms: 300000
    failure-retry-delay-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
