spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financial_statement}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DB_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${DB_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${DB_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        default_schema: ${DB_SCHEMA:public}
    open-in-view: false

  flyway:
    enabled: ${DB_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${DB_FLYWAY_BASELINE_ON_MIGRATE:true}
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

  cloud:
    discovery:
      enabled: ${SPRING_CLOUD_DISCOVERY_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/auth/realms/oauth2-realm}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/auth/realms/oauth2-realm/protocol/openid-connect/certs}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

mail:
  provider: ${MAIL_PROVIDER:smtp}
  from: ${MAIL_FROM:no-reply@contapp.local}
  resend:
    api-key: ${RESEND_API_KEY:}
    reply-to: ${RESEND_REPLY_TO:}

server:
  port: ${PORT:8081}

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  auth:
    converter:
      principle-attribute: ${JWT_PRINCIPAL_ATTR:preferred_username}
      resource-id: ${JWT_RESOURCE_ID:microservices_client}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

services:
  account-info-service:
    base-url: ${ACCOUNT_INFO_SERVICE_URL:https://bef02d1f-e3aa-47bc-a9e9-ab242f8696d0.mock.pstmn.io/accountInfo}
    bearer-token: ${ACCOUNT_INFO_SERVICE_BEARER_TOKEN:}
    mock-mode-enabled: ${ACCOUNT_INFO_SERVICE_MOCK_MODE_ENABLED:false}
    accept-legacy-date-format: ${ACCOUNT_INFO_SERVICE_ACCEPT_LEGACY_DATE_FORMAT:false}

report-email:
  scheduler:
    fixed-delay-ms: ${REPORT_EMAIL_SCHEDULER_DELAY_MS:60000}
    default-timezone: ${REPORT_EMAIL_SCHEDULER_DEFAULT_TIMEZONE:America/Bogota}
    claim-lease-ms: ${REPORT_EMAIL_SCHEDULER_CLAIM_LEASE_MS:300000}
    failure-retry-delay-ms: ${REPORT_EMAIL_SCHEDULER_FAILURE_RETRY_DELAY_MS:300000}
